version: '3.9'

services:
  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/static
      - media_volume:/media
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      - api
      - frontend
    networks:
      - app_network

  api:
    build:
      context: api
    entrypoint: /code/entrypoint.sh
    volumes:
      - ./api:/code
      - static_volume:/static
      - media_volume:/media
    environment:
      - DJANGO_SETTINGS_MODULE=okgbi.settings
      - DJANGO_SUPERUSER_USERNAME=${DJANGO_SUPERUSER_USERNAME:-admin}
      - DJANGO_SUPERUSER_EMAIL=${DJANGO_SUPERUSER_EMAIL:-admin@example.com}
      - DJANGO_SUPERUSER_PASSWORD=${DJANGO_SUPERUSER_PASSWORD:-admin}
      - DJANGO_STATIC_ROOT=${DJANGO_STATIC_ROOT:-/static}
      - DEBUG=False
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    env_file:
      - .env
    depends_on:
      - db
      - redis
    networks:
      - app_network

  celery:
    build:
      context: api
    entrypoint: /code/celery-entrypoint.sh
    volumes:
      - ./api:/code
    environment:
      - DJANGO_SETTINGS_MODULE=okgbi.settings
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DEBUG=True
    env_file:
      - .env
    depends_on:
      - api
      - redis
      - db
    networks:
      - app_network

  redis:
    image: redis:latest
    networks:
      - app_network

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile.prod
      args:
        - REACT_APP_API_URL=${BACKEND_URL}
    environment:
      - NODE_ENV=production
      - REACT_APP_API_URL=${BACKEND_URL}
    depends_on:
      - api
    networks:
      - app_network

  db:
    image: postgres:latest
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    networks:
      - app_network

volumes:
  postgres_data:
  frontend_node_modules:
  static_volume:
  media_volume:

networks:
  app_network:
    driver: bridge
